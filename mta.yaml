_schema-version: 3.3.0
ID: BTPCAP10
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: BTPCAP10-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: BTPCAP10-auth
      - name: BTPCAP10-db
      - name: BTPCAP10-destination

  - name: BTPCAP10-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: BTPCAP10-db

  - name: BTPCAP10-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: BTPCAP10-auth
      - name: srv-api
      - name: BTPCAP10-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: resources/
      requires:
        - name: BTPCAP10projectdetails
          artifacts:
            - projectdetails.zip
          target-path: resources/

  - name: BTPCAP10projectdetails
    type: html5
    path: app/projectdetails
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: BTPCAP10-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet


  - name: BTPCAP10-destinations
    type: com.sap.application.content
    requires:
      - name: BTPCAP10-auth
        parameters:
          service-key:
            name: BTPCAP10-auth-key
      - name: BTPCAP10-html5-repo-host
        parameters:
          service-key:
            name: BTPCAP10-html5-repo-host-key
      - name: srv-api
      - name: BTPCAP10-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: BTPCAP10-html5-repository
              ServiceInstanceName: BTPCAP10-html5-repo-host
              ServiceKeyName: BTPCAP10-html5-repo-host-key
              sap.cloud.service: BTPCAP10.service
            - Name: BTPCAP10-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: BTPCAP10-auth
              ServiceKeyName: BTPCAP10-auth-key
              sap.cloud.service: BTPCAP10.service

resources:
  - name: BTPCAP10-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: BTPCAP10-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'ADRole (BTPCAP10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ADRole'
          - name: 'ManagerRole (BTPCAP10 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ManagerRole'
  - name: BTPCAP10-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: BTPCAP10-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api

  - name: BTPCAP10-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
